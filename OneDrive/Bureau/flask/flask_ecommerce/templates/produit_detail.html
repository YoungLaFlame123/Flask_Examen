{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-lg">
    <h1 class="text-3xl font-semibold text-center mb-4">{{ product.name }}</h1>
    
    <div class="flex justify-center mb-4">
        <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-1/2 h-auto rounded">
    </div>
    
    <div class="text-center mb-4">
        <p class="text-lg font-bold text-green-600">{{ product.price }} Fcfa</p>
    </div>
    
    <div class="mb-4">
        <h2 class="text-xl font-semibold">Description :</h2>
        <p class="text-gray-700">{{ product.description }}</p>
    </div>

    <div class="text-center">
        <a href="{{ url_for('ajouter_panier', product_id=product.id) }}" 
           class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
           Ajouter au panier
        </a>
    </div>
</div>
{% endblock %}
